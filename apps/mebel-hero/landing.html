    <script type="text/babel" data-presets="react">
      (function () {
        const FADE_MS = 500;
        const FADE_OUT_LEAD = 0.55;

        function FadingVideo({ src, className, style }) {
          const videoRef = React.useRef(null);
          const rafRef = React.useRef(null);
          const timerRef = React.useRef(null);
          const fadingOutRef = React.useRef(false);

          React.useEffect(() => {
            const video = videoRef.current;
            if (!video) return undefined;

            const fadeTo = (target, duration = FADE_MS) => {
              if (rafRef.current !== null) cancelAnimationFrame(rafRef.current);
              const from = parseFloat(video.style.opacity || '0') || 0;
              const started = performance.now();
              const step = (now) => {
                const progress = duration <= 0 ? 1 : Math.min((now - started) / duration, 1);
                video.style.opacity = String(from + (target - from) * progress);
                if (progress < 1) {
                  rafRef.current = requestAnimationFrame(step);
                } else {
                  rafRef.current = null;
                }
              };
              rafRef.current = requestAnimationFrame(step);
            };

            const start = () => {
              video.style.opacity = '0';
              const played = video.play();
              if (played && played.catch) played.catch(() => {});
              fadeTo(1);
            };

            const onTimeUpdate = () => {
              const left = video.duration - video.currentTime;
              if (!fadingOutRef.current && left <= FADE_OUT_LEAD && left > 0) {
                fadingOutRef.current = true;
                fadeTo(0);
              }
            };

            const onEnded = () => {
              video.style.opacity = '0';
              timerRef.current = window.setTimeout(() => {
                video.currentTime = 0;
                const played = video.play();
                if (played && played.catch) played.catch(() => {});
                fadingOutRef.current = false;
                fadeTo(1);
              }, 100);
            };

            video.addEventListener('loadeddata', start);
            video.addEventListener('timeupdate', onTimeUpdate);
            video.addEventListener('ended', onEnded);
            if (video.readyState >= 2) start();

            return () => {
              video.removeEventListener('loadeddata', start);
              video.removeEventListener('timeupdate', onTimeUpdate);
              video.removeEventListener('ended', onEnded);
              if (rafRef.current !== null) cancelAnimationFrame(rafRef.current);
              if (timerRef.current !== null) window.clearTimeout(timerRef.current);
            };
          }, [src]);

          return (
            <video
              ref={videoRef}
              src={src}
              className={className}
              style={{ opacity: 0, ...style }}
              autoPlay
              muted
              playsInline
              preload="auto"
            />
          );
        }

        window.FadingVideo = FadingVideo;
      })();
    </script>

    <script type="text/babel" data-presets="react">
      (function () {
        const motion = window.Motion.motion;

        function BlurText({ text, className, align = 'center' }) {
          const ref = React.useRef(null);
          const [inView, setInView] = React.useState(false);

          React.useEffect(() => {
            const node = ref.current;
            if (!node) return undefined;
            const observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) {
                    setInView(true);
                    observer.unobserve(entry.target);
                  }
                });
              },
              { threshold: 0.1 }
            );
            observer.observe(node);
            return () => observer.disconnect();
          }, []);

          const words = text.split(' ');
          const justifyContent = align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center';

          return (
            <p
              ref={ref}
              className={className}
              style={{
                display: 'flex',
                flexWrap: 'wrap',
                justifyContent,
                rowGap: '0.1em',
              }}
            >
              {words.map((word, index) => (
                <motion.span
                  key={word + index}
                  style={{ display: 'inline-block', marginRight: '0.28em' }}
                  initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                  animate={
                    inView
                      ? {
                          filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                          opacity: [0, 0.5, 1],
                          y: [50, -5, 0],
                        }
                      : { filter: 'blur(10px)', opacity: 0, y: 50 }
                  }
                  transition={{
                    duration: 0.7,
                    times: [0, 0.5, 1],
                    ease: 'easeOut',
                    delay: (index * 100) / 1000,
                  }}
                >
                  {word}
                </motion.span>
              ))}
            </p>
          );
        }

        window.BlurText = BlurText;
      })();
    </script>

    <script type="text/babel" data-presets="react">
      (function () {
        const { ChevronLeft, ChevronRight } = window;

        const MIN_POS = 2;
        const MAX_POS = 98;
        const clamp = (value) => Math.max(MIN_POS, Math.min(MAX_POS, value));

        function BeforeAfter() {
          const frameRef = React.useRef(null);
          const draggingRef = React.useRef(false);
          const [pos, setPos] = React.useState(55);

          const posFromEvent = (event) => {
            const frame = frameRef.current;
            if (!frame) return null;
            const rect = frame.getBoundingClientRect();
            if (!rect.width) return null;
            return clamp(((event.clientX - rect.left) / rect.width) * 100);
          };

          React.useEffect(() => {
            const onMove = (event) => {
              if (!draggingRef.current) return;
              const next = posFromEvent(event);
              if (next !== null) setPos(next);
            };
            const onUp = () => {
              draggingRef.current = false;
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onUp);
            window.addEventListener('pointercancel', onUp);

            return () => {
              window.removeEventListener('pointermove', onMove);
              window.removeEventListener('pointerup', onUp);
              window.removeEventListener('pointercancel', onUp);
            };
          }, []);

          const onPointerDown = (event) => {
            draggingRef.current = true;
            const next = posFromEvent(event);
            if (next !== null) setPos(next);
          };

          const onKeyDown = (event) => {
            if (event.key === 'ArrowLeft') {
              event.preventDefault();
              setPos((current) => clamp(current - 4));
            }
            if (event.key === 'ArrowRight') {
              event.preventDefault();
              setPos((current) => clamp(current + 4));
            }
          };

          return (
            <div
              id="before-after"
              ref={frameRef}
              role="slider"
              aria-label="Сравнение до и после чистки"
              aria-valuemin={MIN_POS}
              aria-valuemax={MAX_POS}
              aria-valuenow={Math.round(pos)}
              tabIndex={0}
              onPointerDown={onPointerDown}
              onKeyDown={onKeyDown}

              <img
                src={window.PHOTO_BEFORE}
                alt="До чистки"
                draggable="false"
                style={{ clipPath: `inset(0 ${100 - pos}% 0 0)` }}
                className="absolute inset-0 w-full h-full max-w-none object-cover select-none"
              />

              <div
                className="absolute top-0 bottom-0 w-[2px] bg-white/90 z-20 pointer-events-none"
                style={{ left: `${pos}%` }}
              >

                После

            </div>
          );
        }

        window.BeforeAfter = BeforeAfter;
      })();
    </script>

            title: 'Пятна и запахи',
            text:
              'Био-ферменты расщепляют источник запаха, а не маскируют его. Убираем следы животных, вино, кофе, жир и детские сюрпризы.',
          },
        ];

        const inView = (delay) => ({
          initial: { filter: 'blur(10px)', opacity: 0, y: 20 },
          whileInView: { filter: 'blur(0px)', opacity: 1, y: 0 },
          viewport: { once: true, amount: 0.2 },
          transition: { duration: 0.8, delay, ease: 'easeOut' },
        });

        function Services() {
          return (
            <section className="relative w-full min-h-screen overflow-hidden bg-[#050505]">
              <FadingVideo
                src={window.VIDEO_SERVICES}
                className="absolute inset-0 w-full h-full max-w-none object-cover z-0"
              />

              <div className="absolute inset-0 z-[1] bg-black/55" />

              <div className="relative z-10 px-8 md:px-16 lg:px-20 pt-24 pb-10 flex flex-col min-h-screen">
                <div className="mb-auto">
                  <motion.p {...inView(0)} className="text-sm font-body text-white/80 mb-6">
                    // Услуги
                  </motion.p>

                  <motion.h2
                    {...inView(0.15)}
                    className="font-heading italic text-white text-5xl md:text-6xl lg:text-[5.5rem] leading-[0.95] tracking-[-2px]"
                  >
                    Чистота
                    <br />
                    до волокна
                  </motion.h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
                  {SERVICES.map(({ Icon, tags, title, text }, index) => (
                    <motion.div
                      key={title}
                      {...inView(index * 0.12)}
                      className="liquid-glass rounded-[1.25rem] p-6 min-h-[360px] flex flex-col"
                    >
                      <div className="flex items-start justify-between gap-4">
                        <div className="liquid-glass w-11 h-11 rounded-[0.75rem] flex items-center justify-center shrink-0">
                          <Icon className="h-6 w-6 text-white" />
                        </div>
                        <div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
                          {tags.map((tag) => (
                            <span
                              key={tag}
                              className="liquid-glass rounded-full px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap"
                            >
                              {tag}
                            </span>
                          ))}
                        </div>
                      </div>

                      <div className="flex-1" />

                      <div className="mt-6">
                        <h3 className="font-heading italic text-white text-3xl md:text-4xl tracking-[-1px] leading-none">
                          {title}
                        </h3>
                        <p className="mt-3 text-sm text-white/90 font-body font-light leading-snug max-w-[32ch]">
                          {text}
                        </p>
                      </div>
                    </motion.div>
                  ))}
                </div>
              </div>
            </section>
          );
        }

        window.Services = Services;
      })();
    </script>

    <script type="text/babel" data-presets="react">
      (function () {
        const { Hero, Services } = window;

        function App() {
          return (
            <main className="bg-[#050505]">
              <Hero />
              <Services />
            </main>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      })();
    </script>
  </body>
</html>
